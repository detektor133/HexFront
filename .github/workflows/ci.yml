name: ci

on:
  push:
    branches: [main, 'stage-*', 'agent/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Пуш только служебных docs (отметки этапа, STATUS, отчёты) наследует CI предыдущего пуша.
      - id: scope
        run: node --experimental-strip-types tools/ci-wait/src/docs-only.ts
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GITHUB_TOKEN: ${{ github.token }}
      - if: steps.scope.outputs.mode == 'full'
        uses: pnpm/action-setup@v4
      - if: steps.scope.outputs.mode == 'full'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.scope.outputs.mode == 'full'
        run: pnpm install --frozen-lockfile
      - if: steps.scope.outputs.mode == 'full'
        run: pnpm check

  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: >-
          node --experimental-strip-types tools/commit-check/src/cli.ts
          ${{ github.event.pull_request.base.sha }}
          ${{ github.event.pull_request.head.sha }}
          ${{ github.head_ref }}
