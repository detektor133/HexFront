name: ci

# Задача CI — быстро ответить, не сломан ли присланный код. Три независимых job идут одновременно:
# статика (типы, линт, зависимости, токены), быстрые тесты и сквозной smoke в браузере.
# Время прогона = самый долгий job, а не сумма. Тяжёлые тесты и покрытие — в slow.yml по расписанию.
on:
  push:
    branches: [main, 'stage-*', 'agent/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Пуш только служебных docs получает собственный зелёный workflow текущего SHA без сборки.
      - id: scope
        run: node --experimental-strip-types tools/ci-wait/src/docs-only.ts
        env:
          BEFORE_SHA: ${{ github.event.before }}

  static:
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm depcheck
      - run: pnpm tokens --check
      - run: pnpm typecheck
      - run: pnpm -r --if-present build

  unit:
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  smoke:
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Без кэша каждый прогон скачивал Chromium заново. Ключ — версия @playwright/test.
      - id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/client/package.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @hexfront/client exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @hexfront/client exec playwright install-deps chromium
      - run: pnpm test:e2e:layout

  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: >-
          node --experimental-strip-types tools/commit-check/src/cli.ts
          ${{ github.event.pull_request.base.sha }}
          ${{ github.event.pull_request.head.sha }}
          ${{ github.head_ref }}
