name: pages

on:
  push:
    branches: [main, 'stage-*']

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.21.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Установить зависимости
        run: pnpm install --frozen-lockfile

      - name: Проверить проект
        run: pnpm lint

      - name: Собрать клиент
        run: pnpm --filter @hexfront/client build

      # wrangler-action в pnpm-монорепозитории ставит wrangler через `pnpm add` в корень
      # и падает без -w; готовый wrangler в PATH action берёт без установки.
      # pages deploy не создаёт проект сам; повторное создание отвечает «already exists».
      - name: Подготовить wrangler и проект Pages
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Подготовка пропущена: секреты Cloudflare не настроены"
            exit 0
          fi
          npm install -g wrangler@4
          if ! out=$(wrangler pages project create hexfront --production-branch=main 2>&1); then
            echo "$out"
            echo "$out" | grep -qi "already exists" || exit 1
          fi

      - name: Опубликовать в Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/client/dist --project-name=hexfront --branch=${{ github.ref_name }}

      - name: Пропустить публикацию без секретов Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: 'echo "Публикация пропущена: секреты Cloudflare не настроены"'
